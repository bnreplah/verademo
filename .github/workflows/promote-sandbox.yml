name: promote sandbox

on: 
  workflow_dispatch:
    inputs:
      SANDBOX:
        type: string
  pull_request:
  
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: "promote sandbox scan"
        env:
            VERACODE_API_KEY_ID:  ${{secrets.VERACODE_API_ID}}
            VERACODE_API_KEY_SECRET: ${{secrets.VERACODE_API_KEY}}
            SANDBOXNAME: ${{ github.event_name == 'workflow_dispatch' && inputs.SANDBOX || github.head_ref }}
        run: |
            echo "Downloading the latest version of the Veracode Java API Wrapper"
            WRAPPER_VERSION=`curl https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java/maven-metadata.xml | grep latest |  cut -d '>' -f 2 | cut -d '<' -f 1`
            if `wget https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java/$WRAPPER_VERSION/vosp-api-wrappers-java-$WRAPPER_VERSION.jar -O VeracodeJavaAPI.jar`; then
                chmod 755 VeracodeJavaAPI.jar
                echo '[INFO] SUCCESSFULLY DOWNLOADED WRAPPER'
            else
                echo '[ERROR] DOWNLOAD FAILED'122w
                exit 1
            fi
            ls
            APPNAME=$GITHUB_REPOSITORY
            APP_ID=$( java -jar VeracodeJavaAPI.jar -action getapplist | grep $APPNAME | cut -d '"' -f2 )
            echo "APP ID :" $APP_ID
            echo "GitHub HEAD REF:" $GITHUB_HEAD_REF 
            SANDBOX_ID=$(java -jar VeracodeJavaAPI.jar -action getsandboxlist -appid $APP_ID | grep $SANDBOXNAME | cut -d '"' -f10)
            echo "Sandbox ID:" $SANDBOX_ID
            BUILD_ID=$( java -jar VeracodeJavaAPI.jar -action getbuildinfo -appid $APP_ID -sandboxid SANDBOX_ID | grep "build_id" | cut -d '"' -f10 -z)
            echo "Build ID:" $BUILD_ID
            java -jar VeracodeJavaAPI.jar -action promotesandbox -buildid $BUILD_ID
    
